<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#18181b"/>
  <!-- Concrete surface pattern/texture subtle -->
  <rect x="56" y="56" width="400" height="400" rx="32" fill="#27272a" stroke="#3f3f46" stroke-width="4"/>
  
  <!-- Section corner of concrete -->
  <path d="M 120 120 L 392 120 L 392 392 L 120 392 Z" fill="#3f3f46" stroke="#71717a" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Outer concrete surface line -->
  <line x1="90" y1="422" x2="422" y2="422" stroke="#e4e4e7" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Rebar circle -->
  <circle cx="256" cy="270" r="64" fill="#09090b" stroke="#f59e0b" stroke-width="12"/>
  <circle cx="256" cy="270" r="44" fill="#d97706" opacity="0.8"/>
  <!-- Rebar ribs -->
  <line x1="220" y1="250" x2="292" y2="290" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="270" x2="292" y2="310" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="230" x2="292" y2="270" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Dimension arrows for c_nom -->
  <line x1="256" y1="334" x2="256" y2="416" stroke="#38bdf8" stroke-width="6"/>
  <!-- Arrow heads -->
  <polygon points="256,334 248,348 264,348" fill="#38bdf8"/>
  <polygon points="256,416 248,402 264,402" fill="#38bdf8"/>
  
  <!-- Dimension text -->
  <text x="280" y="382" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">cnom</text>
  
  <!-- Top label EC2 -->
  <text x="256" y="102" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="3">EN 1992-1-1 • DNA W.1</text>
</svg>
