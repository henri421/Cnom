name: Deploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement concurrent ; les executions en cours ne sont pas annulees.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dependances
        run: bun install

      - name: Verification TypeScript
        run: bun run lint

      - name: Tests unitaires (Vitest)
        run: bun run test

      - name: Construction du bundle de production
        # Le site est servi sous https://<compte>.github.io/<depot>/ ; le chemin
        # de base est donc le nom du depot. Pour un domaine personnalise servant
        # le site a la racine, remplacer la valeur par '/'.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Fallback SPA pour les URL inconnues
        run: cp dist/index.html dist/404.html

      - name: Publication de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
